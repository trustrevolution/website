<div id="search-overlay" class="search-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search">
  <div class="search-overlay-header">
    <span class="search-hint">Press <kbd>/</kbd> to search, <kbd>Esc</kbd> to close</span>
    <button class="search-close" aria-label="Close search">&times;</button>
  </div>
  <div class="search-overlay-content">
    <div id="search-container"></div>
  </div>
</div>

<link rel="stylesheet" href="/pagefind/pagefind-ui.css" media="print" onload="this.media='all'">
<script src="/pagefind/pagefind-ui.js" defer></script>
{{- $searchJS := resources.Get "js/search.js" | resources.Minify | resources.Fingerprint -}}
<script src="{{ $searchJS.RelPermalink }}" integrity="{{ $searchJS.Data.Integrity }}" defer></script>
